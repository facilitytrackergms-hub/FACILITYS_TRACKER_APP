<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Management Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-indigo-900 text-white p-4 shadow-xl">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black italic">FACILITY<span class="text-indigo-400">OS</span></h1>
            <div id="connection-status" class="text-[10px] uppercase font-bold px-2 py-1 bg-indigo-800 rounded">Loading...</div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Register New Facility</h2>
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="new-facility-name" placeholder="What is the facility name?" 
                    class="flex-1 border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                <button id="save-facility-btn" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-xl transition shadow-lg shadow-indigo-200">
                    SAVE TO DATABASE
                </button>
            </div>
        </section>

        <div id="facility-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div id="modal-body" class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden">
            </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
