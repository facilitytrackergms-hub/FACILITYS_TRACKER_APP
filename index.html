<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <nav class="bg-blue-600 text-white p-4 shadow-md mb-8">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">FacilityPro</h1>
            <div id="connection-status" class="text-xs bg-blue-700 px-3 py-1 rounded-full text-blue-100">Connecting...</div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Properties Overview</h2>
            <p class="text-slate-500">Real-time status from your Supabase database</p>
        </div>

        <div id="facility-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto mb-4"></div>
                <p class="text-slate-400 font-medium">Fetching facility data...</p>
            </div>
        </div>
    </main>

    <script type="module">
        // Import the client you already created
        import { supabase } from './supabaseClient (2).js';

        async function initApp() {
            const grid = document.getElementById('facility-grid');
            const status = document.getElementById('connection-status');

            try {
                // Fetch facilities with their issues and projects linked
                const { data: facilities, error } = await supabase
                    .from('facilities')
                    .select(`
                        *,
                        facility_issues(id, open_issue),
                        facility_projects(id, active_status)
                    `);

                if (error) throw error;

                status.innerText = "● System Online";
                status.classList.replace('bg-blue-700', 'bg-green-500');
                grid.innerHTML = ''; // Clear the loader

                facilities.forEach(facility => {
                    const openIssues = facility.facility_issues?.filter(i => i.open_issue).length || 0;
                    const activeProjects = facility.facility_projects?.filter(p => p.active_status).length || 0;

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow cursor-pointer";
                    card.innerHTML = `
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-bold text-slate-800 uppercase tracking-tight">${facility.name}</h3>
                                <span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded">ID: ${facility.id.slice(0,5)}</span>
                            </div>
                            <p class="text-slate-500 text-sm mb-4 flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                ${facility.address || 'Address not listed'}
                            </p>
                            
                            <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-50">
                                <div class="text-center p-2 rounded-lg ${openIssues > 0 ? 'bg-orange-50' : 'bg-green-50'}">
                                    <p class="text-xs font-semibold text-slate-400 uppercase">Issues</p>
                                    <p class="text-xl font-black ${openIssues > 0 ? 'text-orange-600' : 'text-green-600'}">${openIssues}</p>
                                </div>
                                <div class="text-center p-2 rounded-lg bg-blue-50">
                                    <p class="text-xs font-semibold text-slate-400 uppercase">Projects</p>
                                    <p class="text-xl font-black text-blue-600">${activeProjects}</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-xs font-medium text-slate-400 italic">${facility.phone || 'No phone'}</span>
                            <button class="text-blue-600 text-xs font-bold hover:underline">VIEW DETAILS →</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                status.innerText = "Connection Failed";
                status.classList.replace('bg-blue-700', 'bg-red-500');
                grid.innerHTML = `<div class="col-span-full bg-red-50 text-red-600 p-6 rounded-xl border border-red-100 text-center">${err.message}</div>`;
            }
        }

        initApp();
    </script>
</body>
</html>
