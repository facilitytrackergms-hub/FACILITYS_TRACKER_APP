<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Tracker</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .facility-card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; align-items: center; }
        .facility-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; margin-right: 15px; }
        .facility-info { flex: 1; }
        button { padding: 6px 12px; margin-top: 5px; cursor: pointer; border-radius: 5px; border: none; background: #1976d2; color: #fff; }
    </style>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function loadFacilities() {
            const { data: facilities, error } = await supabase.from('facilities').select('*');
            if (error) { console.error(error); return; }

            const container = document.getElementById('facilities');
            container.innerHTML = '';

            for (const facility of facilities) {
                const { data: images } = await supabase.from('facility_images')
                    .select('image_url')
                    .eq('related_table', 'facility')
                    .eq('related_id', facility.id)
                    .limit(1);
                const imageUrl = images.length ? images[0].image_url : 'https://via.placeholder.com/80';

                const card = document.createElement('div');
                card.className = 'facility-card';
                card.innerHTML = `
                    <img src="${imageUrl}" alt="Facility Image">
                    <div class="facility-info">
                        <strong>${facility.name}</strong><br>
                        ${facility.address}<br>
                        ${facility.phone}<br>
                        <button onclick="viewFacility('${facility.id}')">View</button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function viewFacility(facilityId) {
            window.location.href = `facility_view.html?id=${facilityId}`;
        }

        window.addEventListener('DOMContentLoaded', loadFacilities);
    </script>
</head>
<body>
    <h1>Facilities</h1>
    <div id="facilities"></div>
</body>
</html>
