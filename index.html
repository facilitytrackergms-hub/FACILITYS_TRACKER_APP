<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Facility Overview</h1>
            <span id="status" class="text-sm text-gray-500">Connecting...</span>
        </header>

        <div id="facility-list" class="grid gap-4">
            <p class="text-center py-10 text-gray-500">Loading your data from Supabase...</p>
        </div>
    </div>

    <script type="module">
        // Import your existing client
        import { supabase } from './supabaseClient (2).js';

        async function loadFacilities() {
            const statusEl = document.getElementById('status');
            const listEl = document.getElementById('facility-list');

            try {
                // Fetch facilities and count open issues
                const { data, error } = await supabase
                    .from('facilities')
                    .select('*, facility_issues(id, open_issue)');

                if (error) throw error;

                statusEl.innerText = "Connected";
                listEl.innerHTML = ''; // Clear loader

                data.forEach(facility => {
                    const openIssues = facility.facility_issues.filter(i => i.open_issue).length;
                    
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center";
                    card.innerHTML = `
                        <div>
                            <h2 class="font-bold text-lg text-blue-600">${facility.name}</h2>
                            <p class="text-gray-500 text-sm">${facility.address || 'No address set'}</p>
                        </div>
                        <div class="text-right">
                            <span class="${openIssues > 0 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'} px-3 py-1 rounded-full text-xs font-bold">
                                ${openIssues} Open Issues
                            </span>
                        </div>
                    `;
                    listEl.appendChild(card);
                });

            } catch (err) {
                statusEl.innerText = "Error";
                listEl.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded">${err.message}</div>`;
            }
        }

        loadFacilities();
    </script>
</body>
</html>
