<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <nav class="bg-indigo-700 p-4 text-white shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">FacilityPro</h1>
            <div id="status" class="text-xs opacity-75">Checking Connection...</div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <div class="bg-white p-6 rounded-xl shadow-sm mb-8 flex gap-4">
            <input type="text" id="fac-name" placeholder="New Facility Name..." class="flex-1 border p-2 rounded-lg">
            <button id="save-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">SAVE</button>
        </div>

        <div id="facility-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>

    <div id="modal-view" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-2xl w-full max-w-md overflow-hidden"></div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
